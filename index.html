<script>


// 点击页面产生小星星效果

document.addEventListener(
"click",
function(e){


let star=document.createElement("span");


star.innerHTML="✨";


star.className="click-star";


star.style.left=e.pageX+"px";

star.style.top=e.pageY+"px";


document.body.appendChild(star);



setTimeout(()=>{

star.remove();

},1000);



}

);
