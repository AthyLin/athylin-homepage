<!DOCTYPE html>
<html lang="zh-CN">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>💌 云端留言板</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

body{
    margin:0;
    min-height:100vh;
    font-family:"Microsoft YaHei";
    background:
    linear-gradient(
        135deg,
        #ffeef8,
        #e8f7ff
    );

    overflow-x:hidden;
}


/* 漂浮元素 */

.float{
    position:fixed;
    animation:fall linear infinite;
    opacity:.8;
}

@keyframes fall{

0%{
transform:translateY(-10vh) rotate(0deg);
}

100%{
transform:translateY(110vh) rotate(360deg);
}

}



nav{

padding:20px;

}


nav a{

text-decoration:none;
color:#ff75b5;
font-size:18px;

}



.card{

width:90%;
max-width:600px;

margin:30px auto;

background:white;

border-radius:25px;

padding:30px;

box-shadow:
0 10px 30px #ffcce6;

}



h1{

text-align:center;

color:#ff75b5;

}



input,textarea{

width:100%;

padding:12px;

margin:10px 0;

border-radius:15px;

border:2px solid #ffd6eb;

font-size:16px;

box-sizing:border-box;

}



textarea{

height:120px;

resize:none;

}



button{

width:100%;

padding:15px;

border:none;

border-radius:20px;

background:#ff8ac6;

color:white;

font-size:18px;

cursor:pointer;

}



button:hover{

background:#ff5ead;

}



.message{

margin-top:15px;

padding:15px;

background:#fff5fa;

border-radius:18px;

animation:show .5s;

}



@keyframes show{

from{

transform:translateY(20px);

opacity:0;

}

to{

opacity:1;

}

}



.time{

font-size:12px;

color:#aaa;

}


</style>

</head>


<body>


<nav>

<a href="index.html">
🌸 返回首页
</a>

</nav>



<div class="card">


<h1>
💌 云端留言板
</h1>


<input id="name"
placeholder="你的名字">


<textarea id="content"
placeholder="写下想说的话...">
</textarea>



<button onclick="sendMessage()">

发送留言 ✨

</button>


<h2>
💗 留言墙
</h2>


<div id="list">

加载中...

</div>



</div>



<script>


// ===== Supabase配置 =====


const SUPABASE_URL =
"你的Supabase项目URL";


const SUPABASE_KEY =
"你的anon key";


const client =
supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);



// ===== 冷却时间 =====

const cooldown = 30000;



async function sendMessage(){


let name =
document.getElementById("name").value.trim();


let content =
document.getElementById("content").value.trim();



if(!name || !content){

alert(
"请填写名字和留言哦 💕"
);

return;

}



let last =
localStorage.getItem(
"lastMessageTime"
);



if(
last &&
Date.now()-last < cooldown
){

alert(
"发送太快啦，请稍等一下哦 🌸"
);

return;

}




let {error}=await client

.from("messsage")

.insert({

name:name,

content:content

});



if(error){

console.log(error);

alert(
"发送失败，请检查数据库设置"
);

return;

}



localStorage.setItem(
"lastMessageTime",
Date.now()
);



document.getElementById("content").value="";


alert(
"留言成功啦 ✨"
);



loadMessages();


}




async function loadMessages(){



let {data,error}=await client

.from("messsage")

.select("*")

.order(
"created_at",
{
ascending:false
}
);



if(error){

console.log(error);

return;

}



let box =
document.getElementById("list");



box.innerHTML="";



data.forEach(item=>{


box.innerHTML +=`

<div class="message">

<b>
🌸 ${item.name}
</b>

<p>
${item.content}
</p>


<div class="time">

${item.created_at || ""}

</div>


</div>

`;


});



}



loadMessages();




// ===== 漂浮樱花 =====


function createFloat(){


let e=document.createElement("div");

e.className="float";


e.innerHTML=
Math.random()>0.5?
"🌸":"⭐";


e.style.left=
Math.random()*100+"vw";


e.style.fontSize=
15+Math.random()*20+"px";


e.style.animationDuration=
5+Math.random()*8+"s";


document.body.appendChild(e);



setTimeout(()=>{

e.remove();

},12000);



}



setInterval(
createFloat,
600
);



</script>


</body>

</html>
