<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>云端留言板</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<style>

body{
    margin:0;
    min-height:100vh;
    font-family:"Microsoft YaHei",sans-serif;
    background:linear-gradient(135deg,#ffe6f2,#e6f7ff);
    overflow-x:hidden;
}


nav{
    padding:20px;
}


nav a{
    color:#ff70ad;
    text-decoration:none;
    font-size:18px;
}


.card{

    width:90%;
    max-width:600px;

    margin:20px auto;

    background:white;

    padding:30px;

    border-radius:25px;

    box-shadow:
    0 10px 30px rgba(255,120,180,.25);

}


h1{

    text-align:center;
    color:#ff70ad;

}



input,
textarea{

    width:100%;

    padding:12px;

    margin-top:12px;

    border-radius:15px;

    border:2px solid #ffd1e6;

    font-size:16px;

    outline:none;

}



textarea{

    height:120px;

    resize:none;

}



button{

    width:100%;

    margin-top:15px;

    padding:15px;

    border:none;

    border-radius:20px;

    background:#ff82bd;

    color:white;

    font-size:18px;

    cursor:pointer;

}



button:hover{

    background:#ff5da5;

}



.message{

    margin-top:15px;

    padding:15px;

    background:#fff5fa;

    border-radius:18px;

    animation:show .5s;

}



@keyframes show{

from{

opacity:0;

transform:translateY(20px);

}

to{

opacity:1;

transform:translateY(0);

}

}



.time{

    color:#999;

    font-size:12px;

}



.float{

    position:fixed;

    top:-30px;

    animation:fall linear;

    pointer-events:none;

}



@keyframes fall{

    to{

        transform:
        translateY(110vh)
        rotate(360deg);

    }

}


</style>


</head>


<body>


<nav>

<a href="index.html">
返回首页
</a>

</nav>



<div class="card">


<h1>
云端留言板
</h1>



<input
id="name"
placeholder="请输入你的名字">


<textarea
id="content"
placeholder="写下想说的话...">
</textarea>


<button onclick="sendMessage()">

发送留言

</button>


<h2>
留言墙
</h2>


<div id="list">

加载中...

</div>


</div>



<script>


/* =====================
   Supabase配置
===================== */


const SUPABASE_URL =
"https://ppdghfobrrtzxslbtttp.supabase.co";


const SUPABASE_KEY =
"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBwZGdoZm9icnJ0enhzbGJ0dHRwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcxNjcyNjcsImV4cCI6MjEwMjc0MzI2N30.D8opVbmJHz4P0e2aKJNIBpQtBK-k57EjBugmm_f5xzE";



const client =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);



/* =====================
   发送留言
===================== */


async function sendMessage(){


const name =
document
.getElementById("name")
.value
.trim();



const content =
document
.getElementById("content")
.value
.trim();



if(!name || !content){

alert(
"请填写名字和留言哦 🌸"
);

return;

}




// 30秒冷却

const last =
localStorage.getItem(
"lastMessageTime"
);



if(
last &&
Date.now()-last < 30000
){

alert(
"发送太快啦，请稍等30秒 💕"
);

return;

}




const {error}=await client

.from("messages")

.insert({

name:name,

message:content

});





if(error){

console.log(error);

alert(
"发送失败："+error.message
);

return;

}



localStorage.setItem(
"lastMessageTime",
Date.now()
);



document
.getElementById("content")
.value="";



alert(
"留言成功啦 ✨"
);



loadMessages();


}



/* =====================
   获取留言
===================== */


async function loadMessages(){



const {

data,

error

}=await client

.from("messages")

.select("*")

.order(

"created_at",

{

ascending:false

}

);



if(error){

console.log(error);

return;

}



const list =
document.getElementById("list");



list.innerHTML="";



data.forEach(item=>{


list.innerHTML += `


<div class="message">


<b>
🌸 ${item.name}
</b>


<p>
${item.message}
</p>



<div class="time">

${item.created_at}

</div>



</div>


`;



});



}



loadMessages();





/* =====================
   樱花星星漂浮
===================== */


function createFloat(){


const el =
document.createElement("div");



el.className="float";



el.innerHTML =
Math.random()>0.5
?"🌸"
:"⭐";



el.style.left =
Math.random()*100+"vw";



el.style.fontSize =
15+Math.random()*20+"px";



el.style.animationDuration =
5+Math.random()*8+"s";



document.body.appendChild(el);



setTimeout(()=>{

el.remove();

},12000);



}



setInterval(
createFloat,
700
);



</script>


</body>

</html>
