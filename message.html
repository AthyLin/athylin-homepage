<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<title>留言板</title>

<link rel="stylesheet" href="style.css">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

</head>


<body>


<nav>

<a href="index.html">🌸 首页</a>

</nav>



<div class="card">


<h1>💌 云端留言板</h1>


<input id="name" placeholder="你的名字">


<br><br>


<textarea id="content" placeholder="写留言..."></textarea>


<br>


<button onclick="sendMessage()">
发送留言
</button>



<h2>留言记录</h2>


<div id="notice">
💌收到新留言啦！💌
</div>


<!-- 留言显示区域 -->
<div id="list"></div>


</div>



<script>


function showNotice(){


let notice = document.getElementById("notice");


notice.classList.add("show");


setTimeout(()=>{


notice.classList.remove("show");


},3000);


}




const SUPABASE_URL =
"https://ppdghfobrrtzxslbtttp.supabase.co";


const SUPABASE_KEY =
"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBwZGdoZm9icnJ0enhzbGJ0dHRwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcxNjcyNjcsImV4cCI6MjEwMjc0MzI2N30.D8opVbmJHz4P0e2aKJNIBpQtBK-k57EjBugmm_f5xzE";


const client =
supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);





async function sendMessage(){


// ===== 冷却时间 =====

let lastTime =
localStorage.getItem("lastMessageTime");


let now = Date.now();


let cooldown = 30000;



if(lastTime && now-lastTime < cooldown){


let wait = Math.ceil(
(cooldown-(now-lastTime))/1000
);


alert(
"请等待 "+wait+" 秒后再次留言哦 💗"
);


return;


}




// ===== 获取输入 =====


let name =
document.getElementById("name").value.trim();



let content =
document.getElementById("content").value.trim();





if(!name || !content){


alert("请填写完整内容 ✨");


return;


}




// ===== 敏感词过滤 =====


let badWords=[

"垃圾",
"骗子",
"诈骗",
"广告",
"赌博",
"色情",
"辱骂"

];



let checkText =
name + content;



for(let word of badWords){


if(checkText.includes(word)){


alert(
"留言包含不适合内容，请修改后再发送 🛡️"
);


return;


}


}



// ===== 上传 Supabase =====


let {error}=await client
.from("messsage")
.insert({
    name:name,
    content:content
});

if(error){
    console.log(error);
    alert(
        "啊偶，发送失败了呢，请稍后再试呢"
    );
    return;
}

localStorage.setItem(
    "lastMessageTime",
    Date.now()
);



alert(
"💌留言成功啦💌"
);



document.getElementById("name").value="";

document.getElementById("content").value="";



loadMessages();



}





// ===== 新留言检测 =====


let oldCount =
Number(
localStorage.getItem("messageCount")
)
||
0;





async function loadMessages(){



let {data,error}=

await client
.from("messages")
.select("*")
.order(
"created_at",
{
ascending:false
}
);



if(error){

console.log(error);

return;

}




let box =
document.getElementById("list");



if(!box){

console.log("找不到留言列表 list");

return;

}



box.innerHTML="";





// 新留言提醒

if(data.length > oldCount){

showNotice();

}



oldCount = data.length;



localStorage.setItem(
"messageCount",
data.length
);





data.forEach(item=>{


box.innerHTML +=



`

<div class="card">


<h3>${item.name}</h3>


<p>${item.content}</p>


<small>${item.created_at || ""}</small>


</div>


`;



});



}





// 页面打开自动加载留言

loadMessages();



</script>


</body>


</html>
