name: Deploy to GitHub Pages

# 推送到 main 就自动构建并发布到 GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 构建静态站点
        env:
          STATIC_EXPORT: "1"
          # 绑定自定义域名（athylin.cyou）后站点在根路径，不需要 basePath。
          # 如果你改用 http://用户名.github.io/仓库名/ 这种子路径访问，
          # 把下面这行注释打开并改成 /仓库名
          # NEXT_PUBLIC_BASE_PATH: /athylin-homepage
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
